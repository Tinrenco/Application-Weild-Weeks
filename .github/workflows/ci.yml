# Continuous integration: on every push and pull request, check that the API and
# the app still lint, typecheck and build. Temporary on GitHub; to be translated
# into .gitlab-ci.yml when the code moves to the school's GitLab.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci # also generates the Prisma client (postinstall)
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Build the Docker image
        run: docker build -t weild-weeks-api .

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Bundle the app for Android and iOS
        run: npm run build:check
